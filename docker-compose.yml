name: totoro-nexus-prod
services:
  platform-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: agent_platform
      POSTGRES_USER: agent_platform
      POSTGRES_PASSWORD: ${PLATFORM_DB_PASSWORD:-local-development-only}
    volumes:
      - platform-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent_platform -d agent_platform"]
      interval: 5s
      timeout: 3s
      retries: 10
  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    restart: unless-stopped
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/etcd:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    restart: unless-stopped
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/minio:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  standalone:
    image: milvusdb/milvus:v2.5.10
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/milvus:/var/lib/milvus
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3

  attu:
    profiles: ["admin"]
    ports:
      - "127.0.0.1:8000:3000"
    image: zilliz/attu:v2.5
    restart: unless-stopped
    environment:
      MILVUS_URL: standalone:19530
    depends_on:
      standalone:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/',r=>{r.resume();process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 5

  app:
    ports:
      - "127.0.0.1:${APP_PORT:-9900}:9900"
    image: totoro-nexus-app:final
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      MILVUS_HOST: standalone
      MILVUS_PORT: "19530"
      SERVER_PORT: "9900"
      FILE_UPLOAD_PATH: /app/uploads
      CONSOLE_EVAL_PATH: /app/eval
      PLATFORM_DB_URL: jdbc:postgresql://platform-db:5432/agent_platform
      PLATFORM_DB_USER: agent_platform
      PLATFORM_DB_PASSWORD: ${PLATFORM_DB_PASSWORD:-local-development-only}
      PLATFORM_ADMIN_PASSWORD: ${PLATFORM_ADMIN_PASSWORD:-}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:?Set DASHSCOPE_API_KEY or use start.ps1 -CredentialsCsv}
      DASHSCOPE_WORKSPACE_ID: ${DASHSCOPE_WORKSPACE_ID:-}
      DASHSCOPE_RERANK_ENDPOINT: ${DASHSCOPE_RERANK_ENDPOINT:-}
    volumes:
      - ./uploads:/app/uploads
      - ./eval:/app/eval:ro
    depends_on:
      standalone:
        condition: service_healthy
      platform-db:
        condition: service_healthy
    healthcheck:
      # JRE image includes bash: avoid installing curl just for a local HTTP check.
      test: ["CMD", "bash", "-ec", "exec 3<>/dev/tcp/127.0.0.1/9900; printf 'GET /actuator/health HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3; read -r status <&3; [[ $$status == *' 200 '* ]]"]
      interval: 15s
      timeout: 5s
      start_period: 90s
      retries: 8

volumes:
  platform-db-data:
