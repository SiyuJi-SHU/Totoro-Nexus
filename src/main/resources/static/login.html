<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 · Totoro Nexus</title><link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2016%2016'%3E%3Cpath%20d='M13,3%20C7,3%203,7%203,13%20C9,13%2013,9%2013,3%20Z'%20fill='%23667f50'/%3E%3Cpath%20d='M4,12%20Q8,8%2012,4'%20stroke='%23f1f5f1'%20stroke-width='1.1'%20fill='none'%20stroke-linecap='round'/%3E%3C/svg%3E"><link rel="stylesheet" href="/platform.css"><link rel="stylesheet" href="/totoro-companion.css?v=20260920b"></head><body class="login"><main class="panel"><i class="totoro-login-mark" aria-hidden="true"></i><div class="eyebrow">Totoro Nexus</div><h1>进入工作空间</h1><p class="muted">连接资料、工具与可追溯的任务执行。</p><form id="loginForm"><label for="username">账号</label><input id="username" name="username" autocomplete="username" required autofocus><label for="password">密码</label><input id="password" name="password" type="password" autocomplete="current-password" required><button class="primary" type="submit">登录</button><p id="error" class="error-box" role="alert" hidden></p></form><p class="sub" style="margin-top:22px">由管理员创建成员账号。初次部署的登录方式见项目启动说明。</p></main><script src="/platform-common.js"></script><script>document.querySelector('#loginForm').onsubmit=async e=>{e.preventDefault();const button=e.submitter;button.disabled=true;document.querySelector('#error').hidden=true;try{await Platform.api('/api/auth/login',{method:'POST',body:new URLSearchParams(new FormData(e.target))});Platform.resetCsrf();location.href='/';}catch(error){const el=document.querySelector('#error');el.textContent=error.message;el.hidden=false;}finally{button.disabled=false;}};</script></body></html>
