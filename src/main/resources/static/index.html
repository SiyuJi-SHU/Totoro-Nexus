<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agent 工作台 · Totoro Nexus</title><link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2016%2016'%3E%3Cpath%20d='M13,3%20C7,3%203,7%203,13%20C9,13%2013,9%2013,3%20Z'%20fill='%23667f50'/%3E%3Cpath%20d='M4,12%20Q8,8%2012,4'%20stroke='%23f1f5f1'%20stroke-width='1.1'%20fill='none'%20stroke-linecap='round'/%3E%3C/svg%3E"><link rel="stylesheet" href="/platform.css"><link rel="stylesheet" href="/totoro-companion.css?v=20260920b"></head><body><main class="workbench"><header><a class="brand" href="/" style="margin:0"><b>T</b><span>Totoro Nexus<small>用证据回答，让过程可追溯</small></span></a><select id="agentSelect" aria-label="选择智能体"></select><div class="actions"><a id="consoleLink" class="button" href="/console" hidden>Console ↗</a><button id="account">账号</button><button id="logout">退出</button></div></header><div class="chat-layout"><aside><button id="newSession" class="primary" style="width:100%;margin-bottom:16px">＋ 新会话</button><button id="restoreLegacy" type="button" hidden>恢复旧版历史</button><div class="nav-label">最近会话</div><div id="sessions" class="sessions"></div><button id="moreSessions" hidden>加载更多</button><p class="sub">会话固定智能体与资料版本。配置变更用于新会话；补充材料用于下一轮分析。</p></aside><section><div class="heading"><div><div class="eyebrow" id="agentVersion"></div><h1 id="agentTitle">Agent 工作台</h1><p id="greeting" class="muted"></p></div></div><div id="scenePanel" class="scene" hidden><label for="scenario">管理员调试素材 <small>固定的模拟告警与日志</small></label><div class="row"><select id="scenario"></select></div><p id="sceneInfo" class="sub" style="margin:10px 0 0"></p></div><details id="attachmentPanel" class="scene" style="margin-top:12px"><summary>会话附件 · 添加或管理材料</summary><label>会话附件 <small>仅供当前会话使用，不写入共享知识库</small></label><div id="attachmentList" style="margin:8px 0"></div><button type="button" id="uploadAttachmentBtn" style="margin-top:8px">📎 添加附件</button></details><details id="incidentInput" class="scene" hidden><summary>添加告警、日志或反证</summary><label for="incidentText">添加告警或日志 <small>本次材料；补充内容用于后续分析，旧报告依据保持不变</small></label><textarea id="incidentText" rows="4" maxlength="60000" placeholder="粘贴告警、日志或反证；也可上传附件。"></textarea></details><p id="historyNotice" class="notice" hidden>该会话使用升级前配置，仅供查看。请新建会话使用当前行为模式。</p><div id="simulationShortcuts" class="actions" hidden><span class="sub">模拟问题</span><button type="button" data-simulation="slo">SLO 错误率</button><button type="button" data-simulation="postgres">PostgreSQL 磁盘空间</button><small class="sub">填入模拟问题与材料，由你确认后发送</small></div><div id="messages" class="messages" aria-live="polite"></div><div id="runStage" class="run-stage" role="status"></div><div id="currentPlan"></div><details id="liveTrace" hidden><summary>查看本次执行过程</summary><pre id="traceContent"></pre></details><form id="composer" class="composer"><label class="sub" for="question">问题或补充信息</label><textarea id="question" maxlength="8000" rows="3" placeholder="描述问题，或追问刚才回答中的步骤…" required></textarea><div class="actions"><label class="button" id="uploadLabel" hidden>上传资料<input id="chatUpload" type="file" accept=".md,.txt" hidden></label><button id="stop" type="button" class="danger" hidden>停止</button><button id="diagnose" type="button" hidden>分析本次材料</button><button id="send" class="primary" type="submit">发送 ↗</button></div></form></section></div></main><div id="toast" class="toast" role="status" hidden></div><script src="/platform-common.js?v=20260922-timing"></script><script src="/platform-workbench.js?v=20260922-timing"></script><script src="/totoro-companion.js"></script><script src="/build-info.js"></script></body></html>
