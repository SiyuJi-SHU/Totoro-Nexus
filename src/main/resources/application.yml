server:
  port: 9900
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

file:
  upload:
    path: ${FILE_UPLOAD_PATH:./runtime/uploads}
    allowed-extensions: txt,md

milvus:
  host: localhost
  port: 19530
  username: ""
  password: ""
  database: default
  timeout: 10000
  search:
    nprobe: 10

# Spring AI Alibaba DashScope 配置
spring:
  datasource:
    url: ${PLATFORM_DB_URL:jdbc:postgresql://localhost:5433/agent_platform}
    username: ${PLATFORM_DB_USER:agent_platform}
    password: ${PLATFORM_DB_PASSWORD:local-development-only}
    hikari:
      maximum-pool-size: 8
      connection-timeout: 5000
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  mvc:
    async:
      request-timeout: 180000
  ai:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:your-api-key-here}  # 从环境变量读取或使用默认值
      chat:
        options:
          model: deepseek-v4-flash
          timeout: 180000  # 超时时间180秒（3分钟）
      retry:
        max-attempts: 3  # 最大重试次数
        backoff:
          initial-interval: 2000  # 初始重试间隔2秒
          multiplier: 2  # 重试间隔倍数
          max-interval: 10000  # 最大重试间隔10秒

    # Spring AI MCP 客户端配置
    # 如果使用mock数据，请注释这部分内容
    mcp:
      client:
        enabled: false
        name: tencent-mcp-server
        version: 1.0.0
        request-timeout: 60s
        type: ASYNC
        sse:
          connections:
            tencent-cls:
              url: https://mcp-api.tencent-cloud.com
              sse-endpoint: /sse/92XXXXXXXXb4  # 完整的SSE端点路径

# 阿里云 DashScope Embedding API 配置
dashscope:
  api:
    key: ${DASHSCOPE_API_KEY:your-api-key-here}  # 从环境变量读取或使用默认值（用于自定义配置）
  embedding:
    model: qwen3.7-text-embedding-flash  # 默认1024维；切换模型必须重建全部向量
  rerank:
    workspace-id: ${DASHSCOPE_WORKSPACE_ID:}
    endpoint: ${DASHSCOPE_RERANK_ENDPOINT:}
    model: gte-rerank-v2  # qwen3.7-text-rerank 未达到Recall门禁，按PLAN回滚
    timeout-ms: 5000

# 文档分片配置
document:
  chunk:
    strategy: size  # size=标题优先+超长章节细分；heading=每个标题章节一个chunk
    max-size: 1200  # Small retrieval chunks; parent context is expanded from the immutable source after retrieval
    overlap: 200    # Included inside max-size, used only when an oversized section must be split

# RAG 配置
rag:
  top-k: 3  # 检索返回的最相似文档数量
  model: ${spring.ai.dashscope.chat.options.model:deepseek-v4-flash}  # 兼容评测配置，与聊天模型一致
  rerank:
    enabled: true
    candidate-top-k: 10

# Retrieval observability. Prometheus counter names are exported with a _total suffix.
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: oncall-agent

# Prometheus 配置
prometheus:
  base-url: http://localhost:9090
  timeout: 10  # 超时时间（秒）
  mock-enabled: true  # 是否启用 Mock 模式（用于测试）

# CLS 云日志服务配置
cls:
  mock-enabled: true  # 是否启用 Mock 模式（用于测试，设为 true 返回与告警关联的模拟日志数据）

# AIOps 告警场景配置
console:
  eval:
    path: ${CONSOLE_EVAL_PATH:./eval}

aiops:
  smart:
    timeout-ms: 115000 # 与HTTP 120秒上限配合，先取消内部任务
  scenario:
    file: classpath:aiops-scenarios/alert_scenarios_mock.json
    current: apdex_slo_violation_001
