name: totoro-nexus

services:
  tailscale:
    image: tailscale/tailscale:v1.102.4
    restart: unless-stopped
    entrypoint: ["tailscaled"]
    command: ["--state=/var/lib/tailscale/tailscaled.state", "--statedir=/var/lib/tailscale", "--tun=userspace-networking"]
    environment:
      HTTPS_PROXY: ${DEMO_HTTPS_PROXY:-}
      HTTP_PROXY: ${DEMO_HTTPS_PROXY:-}
      NO_PROXY: localhost,127.0.0.1,host.docker.internal
    volumes:
      - tailscale-state:/var/lib/tailscale
    extra_hosts:
      - "host.docker.internal:host-gateway"

  gateway:
    image: nginx:1.28-alpine
    restart: unless-stopped
    network_mode: service:tailscale
    depends_on:
      - tailscale
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  tailscale-state:
    external: true
    name: totoro-nexus_tailscale-state
