events {}

http {
    resolver 127.0.0.11 ipv6=off valid=10s;
    upstream demo_app {
        zone demo_app 64k;
        server host.docker.internal:9900 resolve max_fails=0;
    }
    # A shared demonstration budget; never trust visitor-supplied IP headers.
    limit_req_zone $server_name zone=demo_login:1m rate=5r/m;
    limit_req_zone $server_name zone=demo_runs:1m rate=6r/m;
    limit_req_status 429;
    server {
        listen 8080;
        server_name demo_guard;
        server_tokens off;
        client_max_body_size 6m;
        location = /api/auth/login {
            limit_req zone=demo_login burst=5 nodelay;
            proxy_pass http://demo_app;
        }
        location = /api/platform/runs {
            limit_req zone=demo_runs burst=3 nodelay;
            proxy_pass http://demo_app;
        }
        location / {
            proxy_pass http://demo_app;
        }
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 330s;
        proxy_send_timeout 330s;
    }
}
