events {}

http {
    # Docker Desktop also advertises an IPv6 host address that this network
    # cannot route. Resolve IPv4 dynamically and retry newly restarted apps.
    resolver 127.0.0.11 ipv6=off valid=10s;
    upstream demo_app {
        zone demo_app 64k;
        server host.docker.internal:9900 resolve max_fails=0;
    }
    limit_req_zone $binary_remote_addr zone=demo_login:1m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=demo_runs:1m rate=6r/m;
    limit_req_status 429;

    server {
        listen 127.0.0.1:8080;
        server_tokens off;
        client_max_body_size 6m;

        # All Funnel visitors share these conservative demo limits. No client
        # header is trusted to bypass them. Local development is unaffected.
        location = /api/auth/login {
            limit_req zone=demo_login burst=5 nodelay;
            proxy_pass http://demo_app;
        }
        location = /api/platform/runs {
            limit_req zone=demo_runs burst=3 nodelay;
            proxy_pass http://demo_app;
        }

        # Configuration, evaluation administration and diagnostics stay local.
        location ~ ^/(?:console(?:\.html|/|$)|api/(?:console|platform/admin|upload|chat/rag-eval|scenarios)(?:/|$)|actuator(?:/|$)|milvus(?:/|$)) {
            return 403;
        }

        location / {
            proxy_pass http://demo_app;
        }
        error_page 502 504 =503 @app_restarting;
        location @app_restarting {
            default_type text/html;
            charset utf-8;
            add_header Retry-After 15 always;
            add_header Cache-Control "no-store" always;
            return 503 '<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>项目正在更新</title><body style="font-family:system-ui;max-width:600px;margin:15vh auto;padding:24px"><h1>项目暂时无法连接</h1><p>公网入口正常，但演示应用可能正在更新或重启。请约 15 秒后刷新；如果持续出现，请联系项目所有者。</p><p>已经提交的任务请先检查历史记录，避免重复发送。</p><button onclick="location.reload()">重新连接</button></body></html>';
        }
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 330s;
        proxy_send_timeout 330s;
    }
}
